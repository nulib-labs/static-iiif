AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IIIF Collection Builder

Parameters:
  ServerlessIiifVersion:
    Type: String
    Default: "7.0.1"
  GitHubRepo:
    Type: String
    Description: "URL of your GitHub fork of this repo (e.g. https://github.com/your-org/static-iiif)"
  GitHubBranch:
    Type: String
    Default: main
  GitHubOAuthToken:
    Type: String
    NoEcho: true
    Description: "GitHub personal access token with repo scope (https://github.com/settings/tokens)"
  OpenSearchDomainName:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Bare name of a pre-existing OpenSearch domain (used to build the IAM resource ARN). Leave blank if this stack has no search index."
  OpenSearchEndpoint:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Full https:// endpoint of the OpenSearch domain (used for signed HTTP calls). Leave blank if this stack has no search index."
  SearchIndexName:
    Type: String
    Default: ""
    Description: "OpenSearch index name for this stack's works. Defaults to '<stack-name>-works' if left blank."

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 300
    MemorySize: 1025
    Environment:
      Variables:
        SOURCE_BUCKET: !Sub "${AWS::StackName}-source"
        IIIF_BUCKET: !Sub "${AWS::StackName}-iiif"
        IIIF_BASE_URL: !Sub "https://${AWS::StackName}-iiif.s3.${AWS::Region}.amazonaws.com"
        IMAGE_API_BASE_URL: !Sub "https://${IiifServer.Outputs.FunctionDomain}/iiif/2"

Conditions:
  SearchIndexNameProvided: !Not [!Equals [!Ref SearchIndexName, ""]]

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: IIIFImageFunctionS3Permission
    Properties:
      BucketName: !Sub "${AWS::StackName}-source"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: image/
            Function: !GetAtt IIIFImageFunction.Arn
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag

  IIIFBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-iiif"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
            AllowedOrigins:
              - "*"

  IIIFBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IIIFBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/*"

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # Roles are Cognito Groups so they ride in the ID token as `cognito:groups`
  # and the API can authorize with no extra lookup. Precedence is Cognito's own
  # tie-breaker; the app resolves admin over editor itself, but keeping these
  # consistent avoids surprises for anything else reading the pool.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: admin
      Description: "Full access, including managing users and collection grants"
      Precedence: 0

  EditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: editor
      Description: "Full control of works inside granted collections"
      Precedence: 10

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${AWS::StackName}-identity"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: IIIFBucketRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
        - PolicyName: SourceBucketImageAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/image/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "image/*"

  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  ManifestHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
            IdentitySource: $request.header.Authorization
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "Content-Type"
          - "Authorization"

  ManifestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/manifest/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-manifest-api"
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
      # The import walk hands off to itself when a very large work outruns one
      # invocation's time budget. Lambda's recursive-loop detection treats that
      # as a runaway and TERMINATES the chain after ~16 hops — silently, with
      # nothing in the logs — which stranded large imports at "in-progress".
      # The walk is bounded (MAX_CANVAS_INDEX) and advances monotonically, so
      # opting out is safe and is exactly what this setting is for.
      RecursiveLoop: Allow
      CodeUri: ../
      Handler: index.handler
      Timeout: 900
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: EventBridge
            Destination: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-manifest-api"
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
            # The Users section. Scoped to this stack's own pool, and to the
            # group/user calls it actually makes — notably NOT AdminCreateUser
            # or AdminDeleteUser: accounts stay a console/CLI operation.
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListGroups
                - cognito-idp:ListUsersInGroup
                - cognito-idp:CreateGroup
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        GetManifests:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests
            Method: GET
        CreateManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests
            Method: POST
        ImportManifestPreview:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/import/preview
            Method: POST
        ImportManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/import
            Method: POST
        GetManifestById:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: GET
        DeleteManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: DELETE
        GetImportStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/import-status
            Method: GET
        ImportResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/import-resume
            Method: POST
        ImportFailureEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["lambda"]
              detail-type: ["Lambda Function Invocation Result - Failure"]
              detail:
                requestContext:
                  functionArn:
                    - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-manifest-api"
        UpdateManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: PUT
        UpdateManifestItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/items
            Method: PUT
        UpdateManifestCollections:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/collections
            Method: PUT
        ListCollections:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections
            Method: GET
        ReindexCollections:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/reindex
            Method: POST
        CreateCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections
            Method: POST
        DeleteCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}
            Method: DELETE
        ListUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /users
            Method: GET
        UpdateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /users/{username}
            Method: PUT

  SearchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/search/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-search-api"
      CodeUri: ../
      Handler: index.handler
      Timeout: 900
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          SEARCH_INDEX_NAME: !If [SearchIndexNameProvided, !Ref SearchIndexName, !Sub "${AWS::StackName}-works"]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - es:ESHttpGet
                - es:ESHttpPut
                - es:ESHttpPost
                - es:ESHttpDelete
                - es:ESHttpHead
              Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${OpenSearchDomainName}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
              Condition:
                StringLike:
                  s3:prefix:
                    - "presentation/manifest/*"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/presentation/manifest/*"
      Events:
        SearchQuery:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /search
            Method: GET
        SearchReindex:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /search/reindex
            Method: POST

  IIIFImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-iiif-image"
      CodeUri: lambdas/iiif-image/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/*"
        - S3WritePolicy:
            BucketName: !Sub "${AWS::StackName}-iiif"

  IIIFImageFunctionS3Permission:
    Type: AWS::Lambda::Permission
    DependsOn: IIIFImageFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IIIFImageFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-source"

  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub "${AWS::StackName}-ui"
      Repository: !Ref GitHubRepo
      OauthToken: !Ref GitHubOAuthToken
      CustomRules:
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
          Target: "/index.html"
          Status: "200"
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm ci --prefix ui
            build:
              commands:
                - echo "VITE_IIIF_BASE_URL=$VITE_IIIF_BASE_URL"
                - printf 'VITE_IIIF_BASE_URL=%s\n' "$VITE_IIIF_BASE_URL" > ui/.env.production
                - npm run build --prefix ui
          artifacts:
            baseDirectory: ui/dist
            files:
              - '**/*'
          cache:
            paths:
              - ui/node_modules/**/*
      EnvironmentVariables:
        - Name: VITE_IIIF_BASE_URL
          Value: !Sub "https://${IiifServer.Outputs.FunctionDomain}/iiif/2"
        - Name: VITE_MANIFEST_API_URL
          Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/manifests"
        - Name: VITE_SEARCH_API_URL
          Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/search"
        - Name: VITE_COLLECTION_API_URL
          Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/collections"
        - Name: VITE_STORAGE_BUCKET
          Value: !Sub "${AWS::StackName}-iiif"
        - Name: VITE_SOURCE_BUCKET
          Value: !Sub "${AWS::StackName}-source"
        - Name: VITE_STORAGE_REGION
          Value: !Ref AWS::Region
        - Name: VITE_STORAGE_IDENTITY_POOL_ID
          Value: !Ref CognitoIdentityPool
        - Name: VITE_COGNITO_USER_POOL_ID
          Value: !Ref CognitoUserPool
        - Name: VITE_COGNITO_CLIENT_ID
          Value: !Ref CognitoUserPoolClient

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref GitHubBranch
      EnableAutoBuild: true

  IiifServer:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:625046682746:applications/serverless-iiif
        SemanticVersion: !Ref ServerlessIiifVersion
      Parameters:
        SourceBucket: !Ref IIIFBucket

Outputs:
  SourceBucketName:
    Value: !Sub "${AWS::StackName}-source"
  IIIFBucketName:
    Value: !Sub "${AWS::StackName}-iiif"
  IIIFImageFunctionArn:
    Value: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-iiif-image"
  IiifEndpoint:
    Value: !Sub "https://${IiifServer.Outputs.FunctionDomain}/iiif/2"
  UIEndpoint:
    Value: !Sub "https://${GitHubBranch}.${AmplifyApp.AppId}.amplifyapp.com"
  ManifestApiUrl:
    Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  SearchFunctionRoleArn:
    Description: "IAM role ARN to add to the OpenSearch domain's access policy (es:ESHttp* for this stack's SearchFunction)"
    Value: !GetAtt SearchFunctionRole.Arn
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  CognitoIdentityPoolId:
    Value: !Ref CognitoIdentityPool
