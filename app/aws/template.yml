AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IIIF Collection Builder

Parameters:
  ServerlessIiifVersion:
    Type: String
    Default: "7.0.1"
  GitHubRepo:
    Type: String
    Description: "URL of your GitHub fork of this repo (e.g. https://github.com/your-org/static-iiif)"
  GitHubBranch:
    Type: String
    Default: main
  GitHubOAuthToken:
    Type: String
    NoEcho: true
    Description: "GitHub personal access token with repo scope (https://github.com/settings/tokens)"
  OpenSearchDomainName:
    Type: String
    NoEcho: true
    Description: "Bare name of a pre-existing OpenSearch domain (used to build the IAM resource ARN). REQUIRED — see OpenSearchEndpoint."
  OpenSearchEndpoint:
    Type: String
    NoEcho: true
    Description: "Full https:// endpoint of the OpenSearch domain (used for signed HTTP calls). REQUIRED: the collection works list is served by the index, so a stack without one has no way to list works."
  SearchIndexPrefix:
    Type: String
    Default: ""
    Description: "Prefix for this stack's OpenSearch index and alias names. Must be lowercase. Defaults to the stack name. Index names are built as <prefix>._working and <prefix>.<slug>._pub.<runId>, with <prefix>.<slug> as the alias a consuming site points at."
  # --- CDN and custom domains -------------------------------------------------
  # A dev stack sets none of these: both distributions are still created, and the
  # base URLs point at their generated *.cloudfront.net domains (see Outputs). Only
  # the aliases, the certificate and the DNS records are conditional — so a dev
  # stack exercises the same origins, cache behaviours and CORS headers as staging.
  ProjectName:
    Type: String
    Default: understory
    Description: "PLACEHOLDER — the project name is not settled. Used only to build hostnames (iiif-<project>.<base>, images-<project>.<base>). Must be lowercase; settle it before the first staging deploy, because it ends up inside published document URLs."
  BaseDomainName:
    Type: String
    Default: ""
    Description: "e.g. library.northwestern.edu, or rdc-staging.library.northwestern.edu. Leave blank for a dev stack."
  CertificateArn:
    Type: String
    Default: ""
    Description: "ACM certificate ARN in us-east-1 covering *.<BaseDomainName>. Required whenever BaseDomainName is set; ignored otherwise."
  HostedZoneId:
    Type: String
    Default: ""
    Description: "Route53 hosted zone for BaseDomainName. Optional: leave blank to set the domains up but manage the DNS records elsewhere."

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 300
    MemorySize: 1025
    Environment:
      Variables:
        SOURCE_BUCKET: !Sub "${AWS::StackName}-source"
        IIIF_BUCKET: !Sub "${AWS::StackName}-iiif"
        # Both spaces live under one base URL as path segments, so there is one
        # hostname and one distribution for working/ and published/ alike. See
        # IIIFDistribution: published/ is cached, working/ is routed through
        # uncached, and after OAC there is no direct S3 route to either.
        IIIF_BASE_URL: !If
          - HasCustomDomain
          - !Sub "https://iiif-${ProjectName}.${BaseDomainName}"
          - !Sub "https://${IIIFDistribution.DomainName}"
        IMAGE_API_BASE_URL: !If
          - HasCustomDomain
          - !Sub "https://images-${ProjectName}.${BaseDomainName}/iiif/2"
          - !Sub "https://${ImagesDistribution.DomainName}/iiif/2"

Conditions:
  SearchIndexPrefixProvided: !Not [!Equals [!Ref SearchIndexPrefix, ""]]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref BaseDomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  # Domains can be configured without handing this stack the zone.
  ManageDns: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: IIIFImageFunctionS3Permission
    Properties:
      BucketName: !Sub "${AWS::StackName}-source"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: image/
            Function: !GetAtt IIIFImageFunction.Arn
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag

  IIIFBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-iiif"
      # Nothing reaches this bucket directly any more: every IIIF document is
      # served through IIIFDistribution, which reads via OAC. The website
      # endpoint went with it — it was already unused, because IIIF_BASE_URL has
      # always pointed at the REST endpoint rather than the website one.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Vestigial once CloudFront fronts the bucket: browsers no longer reach S3
      # here, and the CORS headers a viewer sees come from IiifCorsPolicy on the
      # distribution. Kept because it costs nothing and removing it would only
      # matter if something were still reading S3 directly — in which case we
      # would want to find that out from a CORS error rather than a 403.
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
            AllowedOrigins:
              - "*"

  IIIFBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IIIFBucket
      PolicyDocument:
        Statement:
          # Narrowed from /* to the two IIIF spaces. Clover fetches working
          # manifests anonymously, so drafts stay readable — "published" means
          # "in the consuming site's feed", not "visible". What this excludes is
          # internal/*: import status and publish plans are operational, not
          # part of either space. Pyramid TIFFs under image/* are read by
          # serverless-iiif through its own role, never fetched directly.
          #
          # The principal is now CloudFront rather than "*": anonymous reads
          # still work, but only through the distribution, so the cache and the
          # CORS response headers cannot be bypassed. SourceArn is what stops
          # any other account's distribution naming this bucket as an origin.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub "arn:aws:s3:::${AWS::StackName}-iiif/working/*"
              - !Sub "arn:aws:s3:::${AWS::StackName}-iiif/published/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${IIIFDistribution}"

  # --- CDN --------------------------------------------------------------------
  #
  # Policies are declared rather than borrowed from the AWS managed set: the
  # cache key is the whole point of the image distribution, and a magic GUID in
  # the template would hide it.

  IIIFOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-iiif-oac"
        Description: "Signed reads from the IIIF bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  IiifCorsPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-iiif-cors"
        Comment: "IIIF is cross-origin by construction — a viewer on any host fetches these."
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: ["*"]
          AccessControlAllowMethods:
            Items: [GET, HEAD, OPTIONS]
          AccessControlAllowOrigins:
            Items: ["*"]
          AccessControlMaxAgeSec: 3600
          OriginOverride: true

  # The IIIF Image API encodes the entire request in the path —
  # /{id}/{region}/{size}/{rotation}/{quality}.{format} — so the path alone is a
  # complete and correct cache key. Anything else in the key would only fragment
  # it. Accept-Encoding stays out for the same reason: tiles are already-
  # compressed JPEG/PNG, and varying on it would multiply every tile entry.
  ImageApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-image-api"
        Comment: "Tiles are immutable: cache on path only, for a long time."
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  PublishedCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-published"
        Comment: "Published IIIF documents. Long-lived; the publish run invalidates them."
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Working documents are routed through the distribution but never cached by it.
  # Every save is followed almost immediately by a read that has to see it — the
  # same read-your-write constraint that makes the OpenSearch writes use
  # ?refresh=wait_for — so any TTL here shows a curator their previous draft and
  # reads as "the save did nothing".
  WorkingCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-working"
        Comment: "Drafts: pass through to S3 on every request."
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          # Must both be false: CloudFront rejects the whole policy otherwise
          # ("invalid for policy with caching disabled"). They describe how
          # Accept-Encoding enters the CACHE KEY, and a policy with every TTL at
          # zero has no cache to key into. Responses are still compressed — that
          # is `Compress` on the behaviour, which is a separate setting.
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  IIIFDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} IIIF documents"
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If
          - HasCustomDomain
          - [!Sub "iiif-${ProjectName}.${BaseDomainName}"]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: iiif-bucket
            DomainName: !GetAtt IIIFBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt IIIFOriginAccessControl.Id
            # Required alongside OriginAccessControlId, and must be empty: this
            # is how an S3 origin says "OAC, not the legacy OAI".
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: iiif-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref PublishedCachePolicy
          ResponseHeadersPolicyId: !Ref IiifCorsPolicy
        CacheBehaviors:
          - PathPattern: "working/*"
            TargetOriginId: iiif-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref WorkingCachePolicy
            ResponseHeadersPolicyId: !Ref IiifCorsPolicy

  ImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} IIIF Image API"
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If
          - HasCustomDomain
          - [!Sub "images-${ProjectName}.${BaseDomainName}"]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: iiif-lambda
            DomainName: !GetAtt IiifServer.Outputs.FunctionDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: iiif-lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: false
          CachePolicyId: !Ref ImageApiCachePolicy
          ResponseHeadersPolicyId: !Ref IiifCorsPolicy

  # Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone id — the same value in every
  # region and account, not something this stack can look up.
  IIIFDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "iiif-${ProjectName}.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt IIIFDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ImagesDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "images-${ProjectName}.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ImagesDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # Roles are Cognito Groups so they ride in the ID token as `cognito:groups`
  # and the API can authorize with no extra lookup. Precedence is Cognito's own
  # tie-breaker; the app resolves admin over editor itself, but keeping these
  # consistent avoids surprises for anything else reading the pool.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: admin
      Description: "Full access, including managing users and collection grants"
      Precedence: 0

  EditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: editor
      Description: "Full control of works inside granted collections"
      Precedence: 10

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${AWS::StackName}-identity"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: IIIFBucketRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
        - PolicyName: SourceBucketImageAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/image/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "image/*"

  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  ManifestHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
            IdentitySource: $request.header.Authorization
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "Content-Type"
          - "Authorization"

  ManifestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/manifest/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-manifest-api"
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          SEARCH_INDEX_PREFIX: !If [SearchIndexPrefixProvided, !Ref SearchIndexPrefix, !Ref "AWS::StackName"]
          # Built by hand rather than !Ref: the state machine's role is this
          # function's role, so referencing the machine here would be circular.
          PUBLISH_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-publish"
      # The import walk hands off to itself when a very large work outruns one
      # invocation's time budget. Lambda's recursive-loop detection treats that
      # as a runaway and TERMINATES the chain after ~16 hops — silently, with
      # nothing in the logs — which stranded large imports at "in-progress".
      # The walk is bounded (MAX_CANVAS_INDEX) and advances monotonically, so
      # opting out is safe and is exactly what this setting is for.
      RecursiveLoop: Allow
      CodeUri: ../
      Handler: index.handler
      Timeout: 900
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: EventBridge
            Destination: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-iiif/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-manifest-api"
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
            # The working index is maintained write-through from the save
            # paths, and the collection works list is a query against it.
            - Effect: Allow
              Action:
                - es:ESHttpGet
                - es:ESHttpPut
                - es:ESHttpPost
                - es:ESHttpDelete
                - es:ESHttpHead
              Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${OpenSearchDomainName}/*"
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-publish"
            # The publish run drops the edge cache for published/ once it has
            # written it. CloudFront ARNs carry no region segment.
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
                - cloudfront:GetInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${IIIFDistribution}"
            # A "running" status object is only a claim. States.ALL does not
            # catch States.Runtime, so an execution can die without the
            # RecordFailure state ever writing a terminal status — and then the
            # collection is pinned at "running" for ever. Reading the execution
            # is what lets that be reconciled.
            - Effect: Allow
              Action:
                - states:DescribeExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-publish:*"
            # The Users section. Scoped to this stack's own pool, and to the
            # group/user calls it actually makes — notably NOT AdminCreateUser
            # or AdminDeleteUser: accounts stay a console/CLI operation.
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListGroups
                - cognito-idp:ListUsersInGroup
                - cognito-idp:CreateGroup
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        CreateManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests
            Method: POST
        ImportManifestPreview:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/import/preview
            Method: POST
        ImportManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/import
            Method: POST
        GetManifestById:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: GET
        DeleteManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: DELETE
        GetImportStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/import-status
            Method: GET
        ImportResume:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/import-resume
            Method: POST
        ImportFailureEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["lambda"]
              detail-type: ["Lambda Function Invocation Result - Failure"]
              detail:
                requestContext:
                  functionArn:
                    - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-manifest-api"
        UpdateManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}
            Method: PUT
        UpdateManifestItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/items
            Method: PUT
        UpdateManifestCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /manifests/{id}/collection
            Method: PUT
        GetCollectionPublish:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/publish
            Method: GET
        StartCollectionPublish:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/publish
            Method: POST
        PublishCollectionIndex:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/publish/index
            Method: POST
        ListCollectionWorks:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}/works
            Method: GET
        ListCollections:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections
            Method: GET
        ReindexCollections:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/reindex
            Method: POST
        CreateCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections
            Method: POST
        DeleteCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /collections/{slug}
            Method: DELETE
        ListUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /users
            Method: GET
        UpdateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref ManifestHttpApi
            Path: /users/{username}
            Method: PUT

  # The publish pipeline. An INLINE Map, not a Distributed Map: Plan writes the
  # work list to S3 and emits only ~N/25 batch indices as this state's output,
  # which is a few KB against the 256KB state limit. That avoids ItemReader IAM,
  # the ResultWriter payload trap, and the circular dependency a Distributed Map
  # creates by needing states:StartExecution on itself. Inline Map's ceiling of
  # 40 concurrent is well above the 8 we want.
  PublishFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - aws/lambdas/publish/index.js
        External:
          - "@aws-sdk/*"
    Properties:
      FunctionName: !Sub "${AWS::StackName}-publish"
      CodeUri: ../
      Handler: index.handler
      Timeout: 900
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          SEARCH_INDEX_PREFIX: !If [SearchIndexPrefixProvided, !Ref SearchIndexPrefix, !Ref "AWS::StackName"]
          CLOUDFRONT_DISTRIBUTION_ID: !Ref IIIFDistribution
      # Deliberately the same role as ManifestFunction. Both need es:ESHttp*,
      # and the domain's resource policy is not owned by this template — so a
      # second role would mean a second ARN to paste in by hand on every new
      # personal stack, which is one more thing to forget.
      Role: !GetAtt ManifestFunctionRole.Arn

  PublishStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-publish"
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PublishFunction
      Definition:
        Comment: "Publish one collection's IIIF assets and stage its search index"
        StartAt: Plan
        States:
          Plan:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: plan
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "requestedBy.$": "$.requestedBy"
            ResultPath: "$.plan"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: PublishWorks
          PublishWorks:
            Type: Map
            ItemsPath: "$.plan.batches"
            MaxConcurrency: 8
            Parameters:
              task: batch
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "indexName.$": "$.plan.indexName"
              # $$ is the Step Functions CONTEXT object, not the state input:
              # $$.Map.Item.Value is the current item. A single $ makes this
              # $.Map.Item.Value, which looks plausible and fails at runtime with
              # "could not be found in the input". Do not "fix" the doubled $.
              "batchIndex.$": "$$.Map.Item.Value"
            Iterator:
              StartAt: PublishBatch
              States:
                PublishBatch:
                  Type: Task
                  Resource: !GetAtt PublishFunction.Arn
                  Retry:
                    - ErrorEquals:
                        - Lambda.TooManyRequestsException
                        - Lambda.ServiceException
                        - States.TaskFailed
                      IntervalSeconds: 2
                      MaxAttempts: 3
                      BackoffRate: 2
                  End: true
            # The Map's aggregated output is capped at 256KB; each batch writes
            # its own result object to S3, so nothing needs to come back here.
            ResultPath: null
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: WriteCollection
          WriteCollection:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: writeCollection
              "slug.$": "$.slug"
              "runId.$": "$.runId"
            ResultPath: "$.result"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            Next: Invalidate
          # Drop the edge cache for published/ now that every byte of it is
          # written. Deliberately NOT a step that can fail the run: by this point
          # the published documents are correct and durable, and a stale edge
          # cache is hygiene rather than correctness. Catching to Finalize rather
          # than RecordFailure is what stops a CloudFront hiccup reporting a
          # collection as failed when it published perfectly.
          #
          # ResultPath is null so $.result — which Finalize reads — survives.
          Invalidate:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: invalidate
              "slug.$": "$.slug"
              "runId.$": "$.runId"
            ResultPath: null
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.invalidateError"
                Next: Finalize
            Next: Finalize
          Finalize:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: finalize
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "indexName.$": "$.plan.indexName"
              "result.$": "$.result"
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: RecordFailure
            End: true
          RecordFailure:
            Type: Task
            Resource: !GetAtt PublishFunction.Arn
            Parameters:
              task: recordFailure
              "slug.$": "$.slug"
              "runId.$": "$.runId"
              "error.$": "$.error"
            Next: Failed
          Failed:
            Type: Fail
            Error: PublishFailed
            Cause: "The publish run did not complete; see the collection's status object"

  IIIFImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-iiif-image"
      CodeUri: lambdas/iiif-image/
      Handler: index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-source/*"
        - S3WritePolicy:
            BucketName: !Sub "${AWS::StackName}-iiif"

  IIIFImageFunctionS3Permission:
    Type: AWS::Lambda::Permission
    DependsOn: IIIFImageFunction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IIIFImageFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-source"

  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub "${AWS::StackName}-ui"
      Repository: !Ref GitHubRepo
      OauthToken: !Ref GitHubOAuthToken
      CustomRules:
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
          Target: "/index.html"
          Status: "200"
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm ci --prefix ui
            build:
              commands:
                - echo "VITE_IIIF_BASE_URL=$VITE_IIIF_BASE_URL"
                - printf 'VITE_IIIF_BASE_URL=%s\n' "$VITE_IIIF_BASE_URL" > ui/.env.production
                - npm run build --prefix ui
          artifacts:
            baseDirectory: ui/dist
            files:
              - '**/*'
          cache:
            paths:
              - ui/node_modules/**/*
      EnvironmentVariables:
        - Name: VITE_IIIF_BASE_URL
          Value: !Sub "https://${IiifServer.Outputs.FunctionDomain}/iiif/2"
        - Name: VITE_MANIFEST_API_URL
          Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/manifests"
        - Name: VITE_COLLECTION_API_URL
          Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com/collections"
        - Name: VITE_STORAGE_BUCKET
          Value: !Sub "${AWS::StackName}-iiif"
        - Name: VITE_SOURCE_BUCKET
          Value: !Sub "${AWS::StackName}-source"
        - Name: VITE_STORAGE_REGION
          Value: !Ref AWS::Region
        - Name: VITE_STORAGE_IDENTITY_POOL_ID
          Value: !Ref CognitoIdentityPool
        - Name: VITE_COGNITO_USER_POOL_ID
          Value: !Ref CognitoUserPool
        - Name: VITE_COGNITO_CLIENT_ID
          Value: !Ref CognitoUserPoolClient

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref GitHubBranch
      EnableAutoBuild: true

  IiifServer:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:625046682746:applications/serverless-iiif
        SemanticVersion: !Ref ServerlessIiifVersion
      Parameters:
        SourceBucket: !Ref IIIFBucket
        # info.json advertises its own @id, and OpenSeadragon derives every tile
        # URL from it. Without ForceHost that @id is the Lambda Function URL, so
        # viewers walk straight past ImagesDistribution and the cache never sees
        # a tile.
        #
        # This deliberately cannot be !GetAtt ImagesDistribution.DomainName:
        # that distribution takes this app's FunctionDomain as its origin, so
        # pointing back at it is a CloudFormation cycle. Using the custom
        # hostname — a parameter, not an attribute — is what breaks it.
        #
        # The cost is that a dev stack (no custom domain) has no value to pass,
        # so its info.json points at the Function URL and images bypass the CDN.
        # That is a known, bounded dev-only gap. To close it locally: deploy
        # once, read ImagesEndpoint from the outputs, and redeploy with
        # BaseDomainName/ProjectName set to match it.
        ForceHost: !If
          - HasCustomDomain
          - !Sub "images-${ProjectName}.${BaseDomainName}"
          - !Ref "AWS::NoValue"

Outputs:
  SourceBucketName:
    Value: !Sub "${AWS::StackName}-source"
  IIIFBucketName:
    Value: !Sub "${AWS::StackName}-iiif"
  IIIFImageFunctionArn:
    Value: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-iiif-image"
  IiifEndpoint:
    Description: "The Image API's origin, behind ImagesEndpoint. Useful for debugging; not what anything should be pointed at."
    Value: !Sub "https://${IiifServer.Outputs.FunctionDomain}/iiif/2"
  # A dev stack's CloudFront hostnames are generated and opaque (d111111abcdef8
  # shape), so without these there is no way to find them short of the console.
  IIIFEndpoint:
    Description: "Base URL for IIIF documents — the value baked into every manifest id. This is IIIF_BASE_URL."
    Value: !If
      - HasCustomDomain
      - !Sub "https://iiif-${ProjectName}.${BaseDomainName}"
      - !Sub "https://${IIIFDistribution.DomainName}"
  ImagesEndpoint:
    Description: "Base URL for the IIIF Image API. On a dev stack, info.json will still advertise IiifEndpoint — see ForceHost on IiifServer."
    Value: !If
      - HasCustomDomain
      - !Sub "https://images-${ProjectName}.${BaseDomainName}/iiif/2"
      - !Sub "https://${ImagesDistribution.DomainName}/iiif/2"
  IIIFDistributionId:
    Description: "Invalidated by the publish run."
    Value: !Ref IIIFDistribution
  UIEndpoint:
    Value: !Sub "https://${GitHubBranch}.${AmplifyApp.AppId}.amplifyapp.com"
  ManifestApiUrl:
    Value: !Sub "https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  OpenSearchAccessRoleArn:
    Description: "IAM role ARN to add to the OpenSearch domain's access policy (es:ESHttp* for this stack). The domain's resource-based policy is not owned by this template, so this is a manual post-deploy step."
    Value: !GetAtt ManifestFunctionRole.Arn
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  CognitoIdentityPoolId:
    Value: !Ref CognitoIdentityPool
